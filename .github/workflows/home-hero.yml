name: Homepage hero video
on: [pull_request, push]
permissions:
  contents: read
jobs:
  hero-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/home-hero.test.cjs
